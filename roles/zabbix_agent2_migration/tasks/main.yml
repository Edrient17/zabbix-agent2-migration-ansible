---
- name: Run migration preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - preflight

- name: Configure and validate the package repository
  ansible.builtin.import_tasks: repository.yml
  tags:
    - repository

- name: Install Agent 2 and optional integrations
  ansible.builtin.import_tasks: install.yml
  tags:
    - install

- name: Migrate Agent 1 configuration
  ansible.builtin.import_tasks: migrate_config.yml
  tags:
    - configure

- name: Validate Agent 2 before cutover
  ansible.builtin.import_tasks: validate.yml
  tags:
    - validate

- name: Cut over from Agent 1 to Agent 2
  ansible.builtin.import_tasks: cutover.yml
  tags:
    - cutover
