[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True

[ssh_connection]
# 파일럿에 서버를 추가할 때마다 첫 접속에서 호스트 키 수락 여부를 묻는데,
# Ansible은 터미널을 주지 않으므로 물어볼 곳이 없어 접속이 실패한다.
# accept-new는 처음 보는 키만 자동 등록하고, 이미 아는 호스트의 키가 바뀌면
# 그대로 거부한다. 키가 바뀌는 쪽이 실제 위험 신호이므로 그 보호는 남는다.
# -C와 ControlMaster/ControlPersist는 Ansible 기본값이라 다시 적어 준다.
# ssh_args를 지정하면 기본값 전체를 덮어쓰기 때문이다.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
